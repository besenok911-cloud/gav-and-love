<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GAV&LOVE · Кабінет майстра</title>
<style>
  :root{
    --violet:#4a25c9; --violet-d:#3a1c9e; --violet-deep:#1c1340; --violet-soft:#efeaff;
    --paper:#fff; --bg:#f5f2ea; --bg-2:#efeae1; --line:#e4ddcf; --line-soft:#efe9dd;
    --ink:#24203a; --ink-soft:#7a748f;
    --new:#4a25c9; --confirmed:#2f8f5b; --arrived:#0ea5b7; --in_progress:#e6912b;
    --done:#8a83a3; --paid:#1a7f37; --no_show:#8a8a8a; --cancelled:#c0472b; --waitlist:#c9a24a;
    --shadow-sm:0 1px 4px rgba(28,19,64,.06); --shadow:0 8px 30px rgba(28,19,64,.12);
    --font-head:"Playfair Display",Georgia,serif; --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  }
  html{-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--violet)}
  .top{background:var(--violet-deep);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
  .top-in{max-width:1060px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px}
  .top .brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
  .top .brand-sub{font-size:.85rem;color:rgba(255,255,255,.65);font-weight:700;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
  .top .sp{flex:1}
  .top .who{font-weight:800;font-size:.95rem}
  @media(max-width:520px){.top .brand-sub{display:none}}
  .btn{font-family:var(--font-body);font-weight:800;border:1.5px solid transparent;border-radius:999px;
    padding:.6em 1.2em;cursor:pointer;transition:.15s;background:var(--violet);color:#fff;font-size:.92rem}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;padding:.4em .9em;font-size:.82rem}
  .btn.sm{padding:.4em .8em;font-size:.8rem}
  .wrap{max-width:1060px;margin:0 auto;padding:16px}
  /* earnings report */
  .rep-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .report-card h2{margin:0}
  .periods{display:flex;gap:6px;flex-wrap:wrap}
  .periods button{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:.42em .95em;font-weight:800;font-size:.82rem;cursor:pointer;font-family:var(--font-body);transition:.12s}
  .periods button:hover{border-color:var(--violet);color:var(--violet)}
  .periods button.on{background:var(--violet);border-color:var(--violet);color:#fff}
  /* custom від–до range */
  .range{display:flex;align-items:center;gap:4px;margin-left:2px}
  .range input{border:1.5px solid var(--line);border-radius:999px;padding:.32em .6em;font-family:var(--font-body);font-size:.78rem;font-weight:700;color:var(--ink-soft);background:#fff;min-width:0;width:132px}
  .range input:focus{outline:none;border-color:var(--violet)}
  .range .dash{color:var(--ink-soft);font-weight:800}
  .range.on input{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
  @media(max-width:560px){.range{flex-basis:100%;margin-left:0}.range input{flex:1;width:auto}}
  .report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .report-grid .kpi{padding:16px 14px}
  .report-grid .kpi .v{font-size:1.5rem}
  .report-grid .kpi.hero{background:linear-gradient(135deg,var(--violet),var(--violet-d))}
  .report-grid .kpi.hero .v{color:#fff}.report-grid .kpi.hero .l{color:rgba(255,255,255,.85)}
  .rep-note{margin-top:12px;color:var(--ink-soft);font-size:.85rem}
  .cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  @media(max-width:600px){.report-grid{grid-template-columns:1fr 1fr}.report-grid .kpi .v{font-size:1.3rem}}
  @media(min-width:760px){
    .wrap{padding:26px 24px}
    .cols{grid-template-columns:1fr 1fr}
    .card{padding:20px 22px 18px}
  }
  /* login */
  .login{max-width:380px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
  .login h1{font-family:var(--font-head);font-weight:600;margin:0 0 4px;font-size:1.5rem}
  .login p{color:var(--ink-soft);margin:0 0 20px;font-size:.92rem}
  .login input{width:100%;padding:.85em 1em;border:1.5px solid var(--line);border-radius:12px;font-size:1.05rem;margin-bottom:14px;font-family:var(--font-body);text-align:center;letter-spacing:.04em}
  .login input:focus{outline:none;border-color:var(--violet)}
  .login .btn{width:100%;padding:.9em}
  .err{color:var(--cancelled);font-weight:700;font-size:.88rem;min-height:1.1em;margin-top:6px}
  /* cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .card h2{font-family:var(--font-head);font-weight:600;margin:0 0 12px;font-size:1.2rem;display:flex;align-items:center;gap:8px}
  .card h2 .cnt{font-family:var(--font-body);font-size:.8rem;font-weight:800;background:var(--violet-soft);color:var(--violet-d);border-radius:999px;padding:2px 9px}
  .muted{color:var(--ink-soft)}
  .nodata{color:var(--ink-soft);font-size:.9rem;padding:6px 2px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .kpi{background:var(--bg-2);border-radius:12px;padding:12px 10px;text-align:center}
  .kpi .v{font-size:1.25rem;font-weight:900;color:var(--violet-deep);line-height:1.1}
  .kpi .l{font-size:.72rem;color:var(--ink-soft);font-weight:700;margin-top:3px}
  .earn{margin-top:12px;background:linear-gradient(135deg,var(--violet),var(--violet-d));color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .earn .l{font-weight:700;opacity:.9;font-size:.9rem}
  .earn .v{font-size:1.5rem;font-weight:900}
  .earn small{display:block;opacity:.85;font-size:.72rem;font-weight:600}
  /* visit row */
  .visit{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:10px;position:relative}
  .visit.dim{opacity:.55}
  .vhead{display:flex;align-items:baseline;gap:8px}
  .vtime{font-weight:900;font-size:1.05rem;color:var(--violet-deep)}
  .vname{font-weight:800}
  .vprice{margin-left:auto;font-weight:800;color:var(--ink-soft);white-space:nowrap}
  .vsub{color:var(--ink-soft);font-size:.86rem;margin-top:2px}
  .vsub b{color:var(--ink);font-weight:700}
  .badge{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;border-radius:999px;padding:2px 9px;margin-top:8px}
  .qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .qbtns button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;
    padding:.32em .7em;font-size:.76rem;font-weight:800;cursor:pointer;font-family:var(--font-body)}
  .qbtns button.on{color:#fff;border-color:transparent}
  .daygroup{font-weight:800;color:var(--violet-d);margin:14px 0 8px;font-size:.9rem;text-transform:capitalize}
  .daygroup:first-child{margin-top:0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:99;background:var(--paid);color:#fff;
    font-weight:800;padding:.7em 1.3em;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--cancelled)}
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:8px 0 24px}
  /* password modal */
  .pw-back{position:fixed;inset:0;background:rgba(28,19,64,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .pw-back[hidden]{display:none} /* the hidden attribute must beat display:flex above */
  .pw-modal{background:var(--paper);border-radius:20px;padding:24px 22px;width:100%;max-width:380px;box-shadow:var(--shadow)}
  .pw-modal h2{font-family:var(--font-head);font-weight:600;margin:0 0 4px;font-size:1.35rem}
  .pw-hint{color:var(--ink-soft);font-size:.88rem;margin:0 0 16px}
  .pw-modal input{width:100%;padding:.75em .9em;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;margin-bottom:10px;font-family:var(--font-body)}
  .pw-modal input:focus{outline:none;border-color:var(--violet)}
  .pw-act{display:flex;gap:10px;margin-top:8px}
  .pw-act .btn{flex:1}
  .btn.ghost2{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
  #pwBtn{white-space:nowrap}
  @media(max-width:560px){#pwBtn{font-size:0;padding:.4em .7em}#pwBtn::after{content:"🔑";font-size:1rem}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- login -->
<div id="loginView">
  <div class="login">
    <h1>Кабінет майстра</h1>
    <p>Увійдіть за логіном і паролем.<br>Їх видає адміністратор салону.</p>
    <input id="mu-user" autocomplete="username" placeholder="Логін" autocapitalize="off" spellcheck="false">
    <input id="mu-pass" type="password" autocomplete="current-password" placeholder="Пароль">
    <button class="btn" id="loginBtn">Увійти</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- app -->
<div id="appView" hidden>
  <div class="top">
    <div class="top-in">
      <span class="brand">GAV&amp;LOVE</span>
      <span class="brand-sub">Кабінет майстра</span>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <button class="btn ghost" id="pwBtn" title="Змінити пароль">🔑 Пароль</button>
      <button class="btn ghost" id="logoutBtn">Вийти</button>
    </div>
  </div>
  <div class="wrap">
    <div class="card report-card">
      <div class="rep-head">
        <h2>Звіт по заробітку</h2>
        <div class="periods" id="periods">
          <button type="button" data-p="today">Сьогодні</button>
          <button type="button" data-p="week">7 днів</button>
          <button type="button" data-p="month" class="on">Місяць</button>
          <button type="button" data-p="all">Весь час</button>
          <span class="range" id="p-range" title="Довільний період"><input type="date" id="p-from" aria-label="Від"><span class="dash">—</span><input type="date" id="p-to" aria-label="До"></span>
        </div>
      </div>
      <div class="report-grid">
        <div class="kpi hero"><div class="v" id="r-earn">—</div><div class="l">Мій заробіток</div></div>
        <div class="kpi"><div class="v" id="r-rev">—</div><div class="l">Виручка</div></div>
        <div class="kpi"><div class="v" id="r-visits">0</div><div class="l">Оплачених візитів</div></div>
        <div class="kpi"><div class="v" id="r-avg">—</div><div class="l">Середній чек</div></div>
      </div>
      <div class="rep-note" id="r-note"></div>
    </div>

    <div class="cols">
      <div class="card">
        <h2>Сьогодні <span class="cnt" id="today-cnt">0</span></h2>
        <div id="today-list"><p class="nodata">Завантаження…</p></div>
      </div>
      <div class="card">
        <h2>Найближчі записи <span class="cnt" id="up-cnt">0</span></h2>
        <div id="up-list"></div>
      </div>
    </div>

    <div class="foot">GAV&amp;LOVE · оновлено <span id="upd"></span></div>
  </div>
</div>

<!-- change password -->
<div class="pw-back" id="pwBack" hidden>
  <div class="pw-modal">
    <h2 id="pwTitle">Зміна пароля</h2>
    <p class="pw-hint" id="pwHint"></p>
    <input type="password" id="pw-old" placeholder="Поточний пароль" autocomplete="current-password">
    <input type="password" id="pw-new" placeholder="Новий пароль" autocomplete="new-password">
    <input type="password" id="pw-new2" placeholder="Повторіть новий пароль" autocomplete="new-password">
    <div class="err" id="pwErr"></div>
    <div class="pw-act">
      <button class="btn ghost2" id="pw-cancel">Скасувати</button>
      <button class="btn" id="pw-save">Зберегти</button>
    </div>
  </div>
</div>

<script>
(function(){
  var API="https://gavlove-booking.besenok911.workers.dev";
  var KEY="gavlove_master_token";
  var $=function(s){return document.querySelector(s);};
  var token="", data=null, _tt, period="month", mustChange=0, customFrom="", customTo="";
  try{token=localStorage.getItem(KEY)||"";}catch(e){}

  var STL={new:"Нова",confirmed:"Підтверджена",arrived:"Прибув",in_progress:"У процесі",done:"Готово",paid:"Оплачено",no_show:"Не прийшов",cancelled:"Скасована",waitlist:"Лист очікування"};
  var STC={new:"var(--new)",confirmed:"var(--confirmed)",arrived:"var(--arrived)",in_progress:"var(--in_progress)",done:"var(--done)",paid:"var(--paid)",no_show:"var(--no_show)",cancelled:"var(--cancelled)",waitlist:"var(--waitlist)"};
  var QS=[["arrived","Прибув"],["in_progress","У роботі"],["done","Готово"],["paid","Оплачено"],["no_show","Не прийшов"]];
  var DOWL=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  var MON=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function money(n){n=Math.round(Number(n)||0);return n.toLocaleString("uk-UA").replace(/ /g," ")+" ₴";}
  function pad(n){return (n<10?"0":"")+n;}
  function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function todayISO(){return isoOf(new Date());}
  function fmtD(iso){var p=String(iso||"").split("-");return p.length===3?(p[2]+"."+p[1]+"."+p[0]):iso;}
  function periodLabel(){
    if(period==="custom")return "з "+(customFrom?fmtD(customFrom):"початку")+" по "+(customTo?fmtD(customTo):"сьогодні");
    return {today:"сьогодні",week:"останні 7 днів",month:"цей місяць",all:"весь час"}[period]||"";}
  function inPeriod(dateStr){
    if(!dateStr)return false;var t=todayISO();
    if(period==="custom"){if(customFrom&&dateStr<customFrom)return false;if(customTo&&dateStr>customTo)return false;return true;}
    if(period==="today")return dateStr===t;
    if(period==="week"){var d=new Date();d.setDate(d.getDate()-6);return dateStr>=isoOf(d)&&dateStr<=t;}
    if(period==="month")return dateStr.slice(0,7)===t.slice(0,7);
    return true;
  }
  function toast(msg,err){var t=$("#toast");t.textContent=msg;t.classList.toggle("err",!!err);t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove("show");},2200);}

  function salaryFor(m,rev,visits){var t=m.salary_type||"",v=Number(m.salary_value)||0,b=Number(m.salary_base)||0;
    if(t==="percent")return Math.round(rev*v/100);
    if(t==="per_visit")return visits*v;
    if(t==="fixed")return v;
    if(t==="base_pct")return Math.round(b+rev*v/100);
    return null;}
  function salaryNote(m){var t=m.salary_type||"",v=Number(m.salary_value)||0,b=Number(m.salary_base)||0;
    if(t==="percent")return v+"% від виручки";
    if(t==="per_visit")return v+" ₴/візит";
    if(t==="fixed")return "фіксована ставка";
    if(t==="base_pct")return money(b)+" + "+v+"%";
    return "схему задасть адмін";}

  async function load(){
    var r=await fetch(API+"/master/data",{headers:{"Authorization":"Bearer "+token}});
    if(r.status===401)throw {code:401};
    if(!r.ok)throw {code:r.status};
    return r.json();
  }
  function doLogin(user,pass){
    $("#loginErr").textContent="Вхід…";
    fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,password:pass})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||!d.ok){$("#loginErr").textContent=(d&&d.error)||"Невірний логін або пароль.";return;}
        if(d.role!=="master"){$("#loginErr").textContent="Цей акаунт не є майстром. Увійдіть у CRM.";return;}
        token=d.token;mustChange=d.must_change?1:0;try{localStorage.setItem(KEY,token);}catch(e){}
        load().then(function(dd){data=dd;showApp();if(mustChange)setTimeout(function(){openPw(true);},350);})
          .catch(function(){$("#loginErr").textContent="Не вдалося завантажити дані.";});
      })
      .catch(function(){$("#loginErr").textContent="Помилка з'єднання. Спробуйте ще.";});
  }
  function restore(){
    load().then(function(d){data=d;showApp();}).catch(function(){logoutLocal();showLogin();});
  }
  function logoutLocal(){token="";data=null;try{localStorage.removeItem(KEY);}catch(e){}}
  function showLogin(){$("#loginView").hidden=false;$("#appView").hidden=true;$("#pwBack").hidden=true;}
  function showApp(){$("#loginView").hidden=true;$("#appView").hidden=false;render();}

  function fmtDayLabel(iso){
    var d=new Date(iso+"T12:00:00");var t=todayISO();
    var tm=new Date(t+"T12:00:00");var diff=Math.round((d-tm)/864e5);
    var base=d.getDate()+" "+MON[d.getMonth()]+", "+DOWL[d.getDay()].toLowerCase();
    if(diff===0)return "Сьогодні · "+base;
    if(diff===1)return "Завтра · "+base;
    return base;
  }
  function visitHtml(b,dim){
    var st=b.status||"new";
    var pet=[b.pet,b.pet_name?("«"+b.pet_name+"»"):""].filter(Boolean).join(" ");
    var sub=[pet,b.breed,b.weight].filter(Boolean).join(" · ");
    var qs=QS.map(function(q){return '<button data-id="'+b.id+'" data-st="'+q[0]+'" class="'+(st===q[0]?"on":"")+'" style="'+(st===q[0]?"background:"+STC[q[0]]:"")+'">'+q[1]+'</button>';}).join("");
    return '<div class="visit'+(dim?" dim":"")+'">'+
      '<div class="vhead"><span class="vtime">'+esc(b.time||"—")+'</span><span class="vname">'+esc(b.name||"")+'</span>'+
        (Number(b.price)>0?'<span class="vprice">'+money(b.price)+'</span>':'')+'</div>'+
      (sub?'<div class="vsub">'+esc(sub)+'</div>':'')+
      '<div class="vsub"><b>'+esc(b.service||"")+'</b></div>'+
      '<span class="badge" style="background:'+STC[st]+'">'+esc(STL[st]||st)+'</span>'+
      '<div class="qbtns">'+qs+'</div>'+
    '</div>';
  }

  function render(){
    var m=data.master||{}, bs=(data.bookings||[]).slice();
    $("#who").textContent=m.name||"";
    $("#upd").textContent=new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
    var t=todayISO();
    var timed=bs.filter(function(b){return b.date;});
    var today=timed.filter(function(b){return b.date===t;}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"");});
    var upcoming=timed.filter(function(b){return b.date>t && ["new","confirmed","arrived"].indexOf(b.status||"new")>=0;})
      .sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);});

    report();

    $("#today-cnt").textContent=today.length;
    $("#today-list").innerHTML=today.length?today.map(function(b){
      var done=["done","paid","no_show","cancelled"].indexOf(b.status||"")>=0;
      return visitHtml(b,done);
    }).join(""):'<p class="nodata">На сьогодні записів немає.</p>';

    $("#up-cnt").textContent=upcoming.length;
    var byday={},order=[];
    upcoming.forEach(function(b){if(!byday[b.date]){byday[b.date]=[];order.push(b.date);}byday[b.date].push(b);});
    $("#up-list").innerHTML=order.length?order.slice(0,30).map(function(d){
      return '<div class="daygroup">'+esc(fmtDayLabel(d))+'</div>'+byday[d].map(function(b){return visitHtml(b,false);}).join("");
    }).join(""):'<p class="nodata">Попереду записів немає.</p>';

    wireQbtns();
  }

  function report(){
    var m=data.master||{}, bs=(data.bookings||[]);
    var rows=bs.filter(function(b){return (b.status==="done"||b.status==="paid")&&inPeriod(b.date);});
    var revenue=rows.reduce(function(s,b){return s+(Number(b.price)||0);},0), visits=rows.length;
    var sal=salaryFor(m,revenue,visits);
    $("#r-earn").textContent=sal==null?"—":money(sal);
    $("#r-rev").textContent=money(revenue);
    $("#r-visits").textContent=visits;
    $("#r-avg").textContent=visits?money(Math.round(revenue/visits)):"—";
    $("#r-note").textContent=(sal==null?"Схему оплати задасть адміністратор. ":"Схема: "+salaryNote(m)+". ")+"Період: "+periodLabel()+".";
  }

  function wireQbtns(){
    [].forEach.call(document.querySelectorAll(".qbtns button"),function(btn){
      btn.addEventListener("click",function(){setStatus(+btn.dataset.id,btn.dataset.st);});
    });
  }
  function setStatus(id,status){
    var b=(data.bookings||[]).filter(function(x){return x.id===id;})[0];if(!b)return;
    var prev=b.status;b.status=status;render();  // optimistic
    fetch(API+"/master/status",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({id:id,status:status})})
      .then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(){toast("Статус: "+(STL[status]||status));})
      .catch(function(){b.status=prev;render();toast("Не вдалося оновити",true);});
  }

  /* change password */
  function openPw(force){
    if(!token){showLogin();return;}
    var who=(data&&data.master&&data.master.name)?data.master.name:"";
    $("#pwErr").textContent="";$("#pw-old").value="";$("#pw-new").value="";$("#pw-new2").value="";
    $("#pw-old").style.display=force?"none":"";
    $("#pwTitle").textContent=who?("Пароль — "+who):"Зміна пароля";
    $("#pwHint").textContent=(who?("Ви змінюєте пароль для акаунта «"+who+"». "):"")+(force?"Перший вхід — задайте власний пароль замість тимчасового.":"Введіть поточний і новий пароль.");
    $("#pwBack").hidden=false;
  }
  $("#pwBtn").addEventListener("click",function(){openPw(false);});
  $("#pw-cancel").addEventListener("click",function(){$("#pwBack").hidden=true;});
  $("#pwBack").addEventListener("click",function(e){if(e.target===$("#pwBack"))$("#pwBack").hidden=true;});
  $("#pw-save").addEventListener("click",function(){
    var np=$("#pw-new").value,np2=$("#pw-new2").value;
    if(np.length<4){$("#pwErr").textContent="Пароль мінімум 4 символи.";return;}
    if(np!==np2){$("#pwErr").textContent="Паролі не збігаються.";return;}
    $("#pwErr").textContent="";
    fetch(API+"/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({old_password:$("#pw-old").value,new_password:np})})
      .then(function(r){return r.json().then(function(res){return {status:r.status,res:res};});})
      .then(function(x){var res=x.res;
        if(x.status===401||x.status===403){$("#pwBack").hidden=true;logoutLocal();showLogin();$("#loginErr").textContent="Сесія завершилась — увійдіть знову.";return;}
        if(!res||!res.ok){$("#pwErr").textContent=(res&&res.error)||"Не вдалося.";return;}
        mustChange=0;$("#pwBack").hidden=true;toast("Пароль змінено");})
      .catch(function(){$("#pwErr").textContent="Помилка з'єднання.";});
  });

  function submitLogin(){doLogin($("#mu-user").value.trim(),$("#mu-pass").value);}
  $("#loginBtn").addEventListener("click",submitLogin);
  $("#mu-user").addEventListener("keydown",function(e){if(e.key==="Enter")$("#mu-pass").focus();});
  $("#mu-pass").addEventListener("keydown",function(e){if(e.key==="Enter")submitLogin();});
  $("#logoutBtn").addEventListener("click",function(){var t=token;logoutLocal();showLogin();try{fetch(API+"/auth/logout",{method:"POST",headers:{"Authorization":"Bearer "+t}});}catch(e){}});
  function setCustomRange(){
    var f=$("#p-from").value,tt=$("#p-to").value;
    if(!f&&!tt)return;
    if(f&&tt&&f>tt){var s=f;f=tt;tt=s;$("#p-from").value=f;$("#p-to").value=tt;} // swap if entered backwards
    customFrom=f;customTo=tt;period="custom";
    [].forEach.call(document.querySelectorAll("#periods button"),function(x){x.classList.remove("on");});
    $("#p-range").classList.add("on");
    if(data)report();
  }
  $("#p-from").addEventListener("change",setCustomRange);
  $("#p-to").addEventListener("change",setCustomRange);
  [].forEach.call(document.querySelectorAll("#periods button"),function(b){
    b.addEventListener("click",function(){period=b.dataset.p;
      [].forEach.call(document.querySelectorAll("#periods button"),function(x){x.classList.toggle("on",x===b);});
      $("#p-range").classList.remove("on");
      if(data)report();});
  });

  if(token){restore();}else{showLogin();}
})();
</script>
</body>
</html>
