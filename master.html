<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GAV&LOVE · Кабінет майстра</title>
<style>
  :root{
    --violet:#4a25c9; --violet-d:#3a1c9e; --violet-deep:#1c1340; --violet-soft:#efeaff;
    --paper:#fff; --bg:#f5f2ea; --bg-2:#efeae1; --line:#e4ddcf; --line-soft:#efe9dd;
    --ink:#24203a; --ink-soft:#7a748f;
    --new:#4a25c9; --confirmed:#2f8f5b; --arrived:#0ea5b7; --in_progress:#e6912b;
    --done:#8a83a3; --paid:#1a7f37; --no_show:#8a8a8a; --cancelled:#c0472b; --waitlist:#c9a24a;
    --shadow-sm:0 1px 4px rgba(28,19,64,.06); --shadow:0 8px 30px rgba(28,19,64,.12);
    --font-head:"Playfair Display",Georgia,serif; --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  }
  html{-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--violet)}
  .top{background:var(--violet-deep);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .top .brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
  .top .sp{flex:1}
  .top .who{font-weight:800;font-size:.95rem}
  .btn{font-family:var(--font-body);font-weight:800;border:1.5px solid transparent;border-radius:999px;
    padding:.6em 1.2em;cursor:pointer;transition:.15s;background:var(--violet);color:#fff;font-size:.92rem}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;padding:.4em .9em;font-size:.82rem}
  .btn.sm{padding:.4em .8em;font-size:.8rem}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  /* login */
  .login{max-width:380px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
  .login h1{font-family:var(--font-head);font-weight:600;margin:0 0 4px;font-size:1.5rem}
  .login p{color:var(--ink-soft);margin:0 0 20px;font-size:.92rem}
  .login input{width:100%;padding:.85em 1em;border:1.5px solid var(--line);border-radius:12px;font-size:1.05rem;margin-bottom:14px;font-family:var(--font-body);text-align:center;letter-spacing:.04em}
  .login input:focus{outline:none;border-color:var(--violet)}
  .login .btn{width:100%;padding:.9em}
  .err{color:var(--cancelled);font-weight:700;font-size:.88rem;min-height:1.1em;margin-top:6px}
  /* cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .card h2{font-family:var(--font-head);font-weight:600;margin:0 0 12px;font-size:1.2rem;display:flex;align-items:center;gap:8px}
  .card h2 .cnt{font-family:var(--font-body);font-size:.8rem;font-weight:800;background:var(--violet-soft);color:var(--violet-d);border-radius:999px;padding:2px 9px}
  .muted{color:var(--ink-soft)}
  .nodata{color:var(--ink-soft);font-size:.9rem;padding:6px 2px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .kpi{background:var(--bg-2);border-radius:12px;padding:12px 10px;text-align:center}
  .kpi .v{font-size:1.25rem;font-weight:900;color:var(--violet-deep);line-height:1.1}
  .kpi .l{font-size:.72rem;color:var(--ink-soft);font-weight:700;margin-top:3px}
  .earn{margin-top:12px;background:linear-gradient(135deg,var(--violet),var(--violet-d));color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .earn .l{font-weight:700;opacity:.9;font-size:.9rem}
  .earn .v{font-size:1.5rem;font-weight:900}
  .earn small{display:block;opacity:.85;font-size:.72rem;font-weight:600}
  /* visit row */
  .visit{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:10px;position:relative}
  .visit.dim{opacity:.55}
  .vhead{display:flex;align-items:baseline;gap:8px}
  .vtime{font-weight:900;font-size:1.05rem;color:var(--violet-deep)}
  .vname{font-weight:800}
  .vprice{margin-left:auto;font-weight:800;color:var(--ink-soft);white-space:nowrap}
  .vsub{color:var(--ink-soft);font-size:.86rem;margin-top:2px}
  .vsub b{color:var(--ink);font-weight:700}
  .badge{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;border-radius:999px;padding:2px 9px;margin-top:8px}
  .qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .qbtns button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;
    padding:.32em .7em;font-size:.76rem;font-weight:800;cursor:pointer;font-family:var(--font-body)}
  .qbtns button.on{color:#fff;border-color:transparent}
  .daygroup{font-weight:800;color:var(--violet-d);margin:14px 0 8px;font-size:.9rem;text-transform:capitalize}
  .daygroup:first-child{margin-top:0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:99;background:var(--paid);color:#fff;
    font-weight:800;padding:.7em 1.3em;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--cancelled)}
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:8px 0 24px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- login -->
<div id="loginView">
  <div class="login">
    <h1>Кабінет майстра</h1>
    <p>Введіть особистий код доступу.<br>Його видає адміністратор салону.</p>
    <input id="code" inputmode="text" autocomplete="off" placeholder="Ваш код" autocapitalize="off">
    <button class="btn" id="loginBtn">Увійти</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- app -->
<div id="appView" hidden>
  <div class="top">
    <span class="brand">GAV&amp;LOVE</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="logoutBtn">Вийти</button>
  </div>
  <div class="wrap">
    <div class="card" id="statsCard">
      <h2>Мій день</h2>
      <div class="kpis">
        <div class="kpi"><div class="v" id="k-today">0</div><div class="l">записів сьогодні</div></div>
        <div class="kpi"><div class="v" id="k-upcoming">0</div><div class="l">попереду</div></div>
        <div class="kpi"><div class="v" id="k-monthv">0</div><div class="l">візитів / міс.</div></div>
      </div>
      <div class="earn">
        <div><div class="l">Мій заробіток за місяць</div><small id="earn-note"></small></div>
        <div class="v" id="earn-val">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Сьогодні <span class="cnt" id="today-cnt">0</span></h2>
      <div id="today-list"><p class="nodata">Завантаження…</p></div>
    </div>

    <div class="card">
      <h2>Найближчі записи <span class="cnt" id="up-cnt">0</span></h2>
      <div id="up-list"></div>
    </div>

    <div class="foot">GAV&amp;LOVE · оновлено <span id="upd"></span></div>
  </div>
</div>

<script>
(function(){
  var API="https://gavlove-booking.besenok911.workers.dev";
  var KEY="gavlove_master_code";
  var $=function(s){return document.querySelector(s);};
  var code="", data=null, _tt;
  try{code=localStorage.getItem(KEY)||"";}catch(e){}

  var STL={new:"Нова",confirmed:"Підтверджена",arrived:"Прибув",in_progress:"У процесі",done:"Готово",paid:"Оплачено",no_show:"Не прийшов",cancelled:"Скасована",waitlist:"Лист очікування"};
  var STC={new:"var(--new)",confirmed:"var(--confirmed)",arrived:"var(--arrived)",in_progress:"var(--in_progress)",done:"var(--done)",paid:"var(--paid)",no_show:"var(--no_show)",cancelled:"var(--cancelled)",waitlist:"var(--waitlist)"};
  var QS=[["arrived","Прибув"],["in_progress","У роботі"],["done","Готово"],["paid","Оплачено"],["no_show","Не прийшов"]];
  var DOWL=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  var MON=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function money(n){n=Math.round(Number(n)||0);return n.toLocaleString("uk-UA").replace(/ /g," ")+" ₴";}
  function pad(n){return (n<10?"0":"")+n;}
  function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function toast(msg,err){var t=$("#toast");t.textContent=msg;t.classList.toggle("err",!!err);t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove("show");},2200);}

  function salaryFor(m,rev,visits){var t=m.salary_type||"",v=Number(m.salary_value)||0,b=Number(m.salary_base)||0;
    if(t==="percent")return Math.round(rev*v/100);
    if(t==="per_visit")return visits*v;
    if(t==="fixed")return v;
    if(t==="base_pct")return Math.round(b+rev*v/100);
    return null;}
  function salaryNote(m){var t=m.salary_type||"",v=Number(m.salary_value)||0,b=Number(m.salary_base)||0;
    if(t==="percent")return v+"% від виручки";
    if(t==="per_visit")return v+" ₴/візит";
    if(t==="fixed")return "фіксована ставка";
    if(t==="base_pct")return money(b)+" + "+v+"%";
    return "схему задасть адмін";}

  async function load(){
    var r=await fetch(API+"/master/data?code="+encodeURIComponent(code));
    if(r.status===401)throw {code:401};
    if(!r.ok)throw {code:r.status};
    return r.json();
  }
  function tryLogin(c){
    code=c;$("#loginErr").textContent="";
    load().then(function(d){data=d;try{localStorage.setItem(KEY,code);}catch(e){}showApp();})
      .catch(function(e){$("#loginErr").textContent=(e&&e.code===401)?"Невірний код доступу.":"Помилка з'єднання. Спробуйте ще.";});
  }
  function showLogin(){$("#loginView").hidden=false;$("#appView").hidden=true;$("#code").value=code;}
  function showApp(){$("#loginView").hidden=true;$("#appView").hidden=false;render();}

  function fmtDayLabel(iso){
    var d=new Date(iso+"T12:00:00");var t=todayISO();
    var tm=new Date(t+"T12:00:00");var diff=Math.round((d-tm)/864e5);
    var base=d.getDate()+" "+MON[d.getMonth()]+", "+DOWL[d.getDay()].toLowerCase();
    if(diff===0)return "Сьогодні · "+base;
    if(diff===1)return "Завтра · "+base;
    return base;
  }
  function visitHtml(b,dim){
    var st=b.status||"new";
    var pet=[b.pet,b.pet_name?("«"+b.pet_name+"»"):""].filter(Boolean).join(" ");
    var sub=[pet,b.breed,b.weight].filter(Boolean).join(" · ");
    var qs=QS.map(function(q){return '<button data-id="'+b.id+'" data-st="'+q[0]+'" class="'+(st===q[0]?"on":"")+'" style="'+(st===q[0]?"background:"+STC[q[0]]:"")+'">'+q[1]+'</button>';}).join("");
    return '<div class="visit'+(dim?" dim":"")+'">'+
      '<div class="vhead"><span class="vtime">'+esc(b.time||"—")+'</span><span class="vname">'+esc(b.name||"")+'</span>'+
        (Number(b.price)>0?'<span class="vprice">'+money(b.price)+'</span>':'')+'</div>'+
      (sub?'<div class="vsub">'+esc(sub)+'</div>':'')+
      '<div class="vsub"><b>'+esc(b.service||"")+'</b></div>'+
      '<span class="badge" style="background:'+STC[st]+'">'+esc(STL[st]||st)+'</span>'+
      '<div class="qbtns">'+qs+'</div>'+
    '</div>';
  }

  function render(){
    var m=data.master||{}, bs=(data.bookings||[]).slice();
    $("#who").textContent=m.name||"";
    $("#upd").textContent=new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
    var t=todayISO();
    var timed=bs.filter(function(b){return b.date;});
    var today=timed.filter(function(b){return b.date===t;}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"");});
    var upcoming=timed.filter(function(b){return b.date>t && ["new","confirmed","arrived"].indexOf(b.status||"new")>=0;})
      .sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);});

    // month earnings (done+paid in current month)
    var ym=t.slice(0,7);
    var monthRev=bs.filter(function(b){return (b.status==="done"||b.status==="paid")&&(b.date||"").slice(0,7)===ym;});
    var rev=monthRev.reduce(function(s,b){return s+(Number(b.price)||0);},0);
    var sal=salaryFor(m,rev,monthRev.length);

    $("#k-today").textContent=today.length;
    $("#k-upcoming").textContent=upcoming.length;
    $("#k-monthv").textContent=monthRev.length;
    $("#earn-val").textContent=sal==null?"—":money(sal);
    $("#earn-note").textContent=(sal==null?"схему задасть адмін · ":salaryNote(m)+" · ")+"виручка "+money(rev);

    $("#today-cnt").textContent=today.length;
    $("#today-list").innerHTML=today.length?today.map(function(b){
      var done=["done","paid","no_show","cancelled"].indexOf(b.status||"")>=0;
      return visitHtml(b,done);
    }).join(""):'<p class="nodata">На сьогодні записів немає.</p>';

    $("#up-cnt").textContent=upcoming.length;
    var byday={},order=[];
    upcoming.forEach(function(b){if(!byday[b.date]){byday[b.date]=[];order.push(b.date);}byday[b.date].push(b);});
    $("#up-list").innerHTML=order.length?order.slice(0,30).map(function(d){
      return '<div class="daygroup">'+esc(fmtDayLabel(d))+'</div>'+byday[d].map(function(b){return visitHtml(b,false);}).join("");
    }).join(""):'<p class="nodata">Попереду записів немає.</p>';

    wireQbtns();
  }

  function wireQbtns(){
    [].forEach.call(document.querySelectorAll(".qbtns button"),function(btn){
      btn.addEventListener("click",function(){setStatus(+btn.dataset.id,btn.dataset.st);});
    });
  }
  function setStatus(id,status){
    var b=(data.bookings||[]).filter(function(x){return x.id===id;})[0];if(!b)return;
    var prev=b.status;b.status=status;render();  // optimistic
    fetch(API+"/master/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,id:id,status:status})})
      .then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(){toast("Статус: "+(STL[status]||status));})
      .catch(function(){b.status=prev;render();toast("Не вдалося оновити",true);});
  }

  $("#loginBtn").addEventListener("click",function(){tryLogin($("#code").value.trim());});
  $("#code").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin($("#code").value.trim());});
  $("#logoutBtn").addEventListener("click",function(){try{localStorage.removeItem(KEY);}catch(e){}code="";data=null;showLogin();});

  if(code){tryLogin(code);}else{showLogin();}
})();
</script>
</body>
</html>
