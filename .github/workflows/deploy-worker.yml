# Викочування воркера з репозиторію, щоб підтримка не вимагала доступу до чужого Cloudflare.
#
# Як це працює після передачі салону власниці:
#   · репозиторій належить їй, розробник у ньому — Collaborator із правом запису;
#   · токен Cloudflare лежить у СЕКРЕТАХ ЇЇ РЕПОЗИТОРІЮ, розробник його не бачить;
#   · оновлення = коміт. Прибрати розробника з колабораторів = прибрати доступ, одним кліком.
#
# Що має завести власниця один раз (Settings → Secrets and variables → Actions):
#   секрет  CLOUDFLARE_API_TOKEN   — Cloudflare → API Tokens → Create Token → «Edit Cloudflare
#                                    Workers», обмежити її акаунтом. Відкликається однією кнопкою.
#   секрет  CLOUDFLARE_ACCOUNT_ID  — Cloudflare → Workers → Account ID
#   змінна  WORKER_URL             — https://<ім'я-воркера>.<субдомен>.workers.dev (не обов'язково,
#                                    лише щоб після викочування перевірити, що воркер відповідає)
#
# Доки секретів немає, цей файл нічого не робить і не падає.

name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "worker/wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Чи налаштовано доступ до Cloudflare
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN або CLOUDFLARE_ACCOUNT_ID не задані — викочування пропущено. Це не помилка: додайте секрети в Settings → Secrets and variables → Actions."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Синтаксис воркера
        if: steps.gate.outputs.ready == 'yes'
        run: node --check worker/src/index.js

      - name: Викотити
        if: steps.gate.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: 'deploy --env=""'

      # Викочування, яке не перевірили, — це не викочування.
      - name: Перевірити, що воркер відповідає
        if: steps.gate.outputs.ready == 'yes' && vars.WORKER_URL != ''
        run: |
          set -e
          sleep 5
          body=$(curl -fsS "${{ vars.WORKER_URL }}/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::/health не відповів ok"; exit 1; }
