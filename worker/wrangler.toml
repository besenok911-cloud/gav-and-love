name = "gavlove-booking"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
# Origin allowed to call the Worker (the live site). Change if the domain changes.
ALLOW_ORIGIN = "https://besenok911-cloud.github.io"

# CRM database (Cloudflare D1)
[[d1_databases]]
binding = "DB"
database_name = "gavlove-crm"
database_id = "50b72473-38b0-4908-bcf6-3938dffbf3f2"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put SA_EMAIL
#   wrangler secret put SA_PRIVATE_KEY
#   wrangler secret put CALENDAR_ID
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put ADMIN_TOKEN   # password for the admin panel
