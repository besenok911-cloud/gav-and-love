<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>GAV&LOVE · CRM</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#faf7f2; --paper:#fff; --ink:#221a38; --ink-soft:#6d6484;
    --violet:#4a25c9; --violet-d:#3a1c9e; --violet-deep:#1c1340; --violet-soft:#efeaff;
    --line:#e7e0d3; --line-soft:#efe9dd; --bg-2:#f2ece2; --gold:#c9a24a;
    --new:#4a25c9; --confirmed:#2f8f5b; --done:#8a83a3; --cancelled:#c0472b;
    --shadow:0 20px 44px -28px rgba(28,19,64,.4); --shadow-sm:0 10px 26px -18px rgba(28,19,64,.35);
    --font-head:"Playfair Display",Georgia,serif; --font-body:"Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--bg);line-height:1.5}
  a{color:var(--violet)}
  .wrap{max-width:1240px;margin:0 auto;padding:20px}
  header.top{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--violet-deep);color:#fff;flex-wrap:wrap}
  header.top img{height:32px;background:#fff;border-radius:8px;padding:3px 8px}
  header.top h1{font-family:var(--font-head);font-weight:600;font-size:1.15rem;margin:0}
  header.top .sp{margin-left:auto}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
  .tabbtn{border:0;background:transparent;color:#e9e3ff;font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:.45em 1.1em;border-radius:999px;cursor:pointer}
  .tabbtn.on{background:#fff;color:var(--violet-deep)}
  .btn{font-family:var(--font-body);font-weight:700;font-size:.9rem;border:1.5px solid transparent;border-radius:999px;
    padding:.55em 1.2em;cursor:pointer;transition:.2s;background:var(--violet);color:#fff}
  .btn:hover{background:var(--violet-d)}
  .btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.sm{padding:.4em .8em;font-size:.82rem}
  .btn.icon{padding:.3em .5em;background:transparent;border-color:var(--line);color:var(--ink-soft);font-size:.8rem}
  .btn.icon:hover{border-color:var(--violet);color:var(--violet)}
  .btn.danger{background:transparent;border-color:var(--line);color:var(--cancelled)}
  .btn.danger:hover{background:#fff0ee}

  .login{max-width:380px;margin:8vh auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow);text-align:center}
  .login h2{font-family:var(--font-head);font-weight:600;margin:0 0 6px}
  .login p{color:var(--ink-soft);margin:0 0 20px;font-size:.92rem}
  .login input{width:100%;padding:.8em 1em;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;margin-bottom:14px;font-family:var(--font-body)}
  .login input:focus{outline:none;border-color:var(--violet)}
  .login .btn{width:100%;padding:.85em}
  .err{color:var(--cancelled);font-weight:700;font-size:.88rem;min-height:1.2em;margin-top:10px}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.gold::before{background:var(--gold)} .kpi.green::before{background:var(--confirmed)} .kpi.rose::before{background:#bc1888}
  .kpi .ic{font-size:1.15rem}
  .kpi .k{color:var(--ink-soft);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
  .kpi .v{font-family:var(--font-head);font-weight:600;font-size:1.7rem;line-height:1.1;margin-top:2px}
  .kpi .sub{color:var(--ink-soft);font-size:.76rem;margin-top:3px}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
  .panel.full{grid-column:1/-1}
  .panel h3{font-family:var(--font-head);font-weight:600;font-size:1.05rem;margin:0 0 16px;display:flex;align-items:center;gap:.5em}
  .panel h3 .tag{margin-left:auto;font-family:var(--font-body);font-weight:800;font-size:.72rem;color:var(--violet);background:var(--violet-soft);padding:.2em .6em;border-radius:999px}

  .bar-row{display:grid;grid-template-columns:140px 1fr 70px;align-items:center;gap:10px;margin-bottom:10px;font-size:.9rem}
  .bar-row .lbl{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{display:block;background:var(--bg-2);border-radius:999px;height:12px;overflow:hidden}
  .bar-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),#8a63e6);transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .bar-row .num{text-align:right;font-weight:800;color:var(--ink-soft)}

  .days{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .day .db{width:100%;max-width:28px;background:linear-gradient(180deg,#8a63e6,var(--violet));border-radius:6px 6px 0 0;min-height:2px;transition:height .6s cubic-bezier(.2,.7,.2,1)}
  .day .dl{font-size:.66rem;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .day .dv{font-size:.68rem;color:var(--ink);font-weight:800}

  .staff-row{padding:13px 0;border-top:1px solid var(--line-soft)}
  .staff-row:first-child{border-top:0}
  .staff-head{display:flex;align-items:center;gap:12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:none}
  .avatar.c1{background:var(--violet)} .avatar.c2{background:var(--gold)} .avatar.c3{background:var(--confirmed)} .avatar.c4{background:#bc1888} .avatar.c0{background:var(--ink-soft)}
  .staff-meta{flex:1;min-width:0}
  .staff-name{font-weight:800}
  .staff-sub{color:var(--ink-soft);font-size:.8rem}
  .staff-rev{font-family:var(--font-head);font-weight:600;font-size:1.1rem;text-align:right;white-space:nowrap}
  .staff-bar{height:6px;background:var(--bg-2);border-radius:999px;margin-top:9px;overflow:hidden}
  .staff-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#8a63e6);border-radius:999px}
  .nodata{color:var(--ink-soft);text-align:center;padding:16px}

  /* toolbar + table */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}
  .search{flex:1;min-width:180px;padding:.7em 1em;border:1.5px solid var(--line);border-radius:999px;font-size:.95rem;font-family:var(--font-body);background:var(--paper)}
  .search:focus{outline:none;border-color:var(--violet)}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.45em .95em;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--ink);transition:.15s}
  .pill:hover{border-color:var(--violet)}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill .cnt{opacity:.7;font-weight:800;margin-left:.35em}
  .tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
  table{width:100%;border-collapse:collapse;font-size:.84rem;table-layout:auto}
  th,td{padding:.55em .55em;text-align:left;vertical-align:top}
  thead th{background:var(--bg-2);color:var(--ink);font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
  tbody tr{border-top:1px solid var(--line)}
  tbody tr:hover{background:#faf8ff}
  td.client .nm{font-weight:800}
  td.client .ph a{color:var(--violet);text-decoration:none;font-weight:700;font-size:.82rem;word-break:break-all}
  .muted{color:var(--ink-soft)}
  .when{white-space:nowrap;font-weight:700}
  .price{text-align:right;font-family:var(--font-head);font-weight:700;white-space:nowrap}
  .req{display:inline-block;font-size:.64rem;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:.1em .4em;margin-left:.3em}
  .noteic{cursor:help;margin-left:.3em;opacity:.7}
  .src{display:inline-block;font-size:.7rem;font-weight:800;padding:.2em .55em;border-radius:999px}
  .src-site{background:#eef7ff;color:#2a6fb0}.src-phone{background:#eafaf0;color:#2f8f5b}.src-instagram{background:#fdeef6;color:#bc1888}.src-other{background:var(--bg-2);color:var(--ink-soft)}
  select.status{font-family:var(--font-body);font-weight:700;font-size:.8rem;border:1.5px solid var(--line);border-radius:9px;padding:.35em .3em;cursor:pointer;background:#fff;max-width:118px}
  .s-new{color:var(--new)}.s-confirmed{color:var(--confirmed)}.s-done{color:var(--done)}.s-cancelled{color:var(--cancelled)}
  .rowact{display:flex;gap:5px}
  .empty{text-align:center;color:var(--ink-soft);padding:40px}
  .meta{color:var(--ink-soft);font-size:.82rem;margin:10px 2px}

  /* period filter */
  .period{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-soft);font-weight:700}
  .period input{padding:.45em .6em;border:1.5px solid var(--line);border-radius:10px;font-family:var(--font-body);font-size:.85rem;background:var(--paper);color:var(--ink)}
  .period input:focus{outline:none;border-color:var(--violet)}
  .period .clr{border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 4px}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cal-title{font-family:var(--font-head);font-weight:600;font-size:1.3rem;text-transform:capitalize}
  .cal-nav{display:flex;gap:6px;margin-left:auto}
  .cal-nav .btn{border-color:var(--line);color:var(--ink);background:transparent}
  .cal-nav .btn:hover{border-color:var(--violet);color:var(--violet)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-dow{font-weight:800;font-size:.72rem;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:2px 0}
  .cal-cell{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:106px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cal-cell.out{background:var(--bg-2);opacity:.5}
  .cal-cell.today{border-color:var(--violet);box-shadow:0 0 0 1.5px var(--violet)}
  .cal-daynum{font-weight:800;font-size:.8rem;color:var(--ink-soft)}
  .cal-cell.today .cal-daynum{color:var(--violet)}
  .cal-ev{font-size:.7rem;font-weight:700;padding:.2em .45em;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .cal-ev.st-new{background:var(--violet)}.cal-ev.st-confirmed{background:var(--confirmed)}.cal-ev.st-done{background:var(--done)}.cal-ev.st-cancelled{background:var(--cancelled);text-decoration:line-through}
  .cal-more{font-size:.68rem;color:var(--ink-soft);font-weight:700}
  @media(max-width:700px){.cal-cell{min-height:76px}.cal-ev{font-size:.62rem}}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(28,19,64,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px;overflow:auto}
  .modal.open{display:flex}
  .sheet{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);width:min(640px,100%);padding:26px 28px;margin:auto}
  .sheet h2{font-family:var(--font-head);font-weight:600;margin:0 0 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld.wide{grid-column:1/-1}
  .fld label{font-weight:700;font-size:.82rem;color:var(--ink)}
  .fld input,.fld select,.fld textarea{font-family:var(--font-body);font-size:.95rem;color:var(--ink);padding:.6em .75em;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--violet);background:#fff}
  .sheet-act{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .modal-err{color:var(--cancelled);font-weight:700;font-size:.85rem;margin-top:10px;min-height:1em}
  [hidden]{display:none!important}
  @media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.dash-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <img src="assets/brand/logo.svg" alt="GAV&LOVE" />
  <h1>CRM</h1>
  <div class="tabs" id="tabs" hidden>
    <button class="tabbtn on" data-view="dash">Огляд</button>
    <button class="tabbtn" data-view="list">Записи</button>
    <button class="tabbtn" data-view="cal">Календар</button>
  </div>
  <span class="sp"></span>
  <button class="btn ghost sm" id="refreshBtn" hidden>↻ Оновити</button>
  <button class="btn ghost sm" id="logoutBtn" hidden>Вийти</button>
</header>

<div class="login" id="loginCard">
  <h2>Вхід у CRM</h2>
  <p>Введіть пароль доступу до панелі записів.</p>
  <input type="password" id="tokenInput" placeholder="Пароль" autocomplete="current-password" />
  <button class="btn" id="loginBtn">Увійти</button>
  <p class="err" id="loginErr"></p>
</div>

<div class="wrap" id="dashView" hidden></div>

<div class="wrap" id="listView" hidden>
  <div class="toolbar">
    <input class="search" id="search" placeholder="Пошук: ім'я, телефон, послуга, майстер…" />
    <div class="pills" id="pills"></div>
    <div class="period"><span>Період:</span><input type="date" id="pFrom" title="від"><span>–</span><input type="date" id="pTo" title="до"><button class="clr" id="pClear" title="Очистити">×</button></div>
    <span class="sp" style="flex:1"></span>
    <button class="btn" id="newBtn">+ Нова заявка</button>
  </div>
  <p class="meta" id="meta"></p>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Клієнт</th><th>Улюбленець</th><th>Послуга</th><th>Візит</th>
        <th>Майстер</th><th>Сума</th><th>Джерело</th><th>Статус</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>Записів поки немає.</div>
</div>

<div class="wrap" id="calView" hidden></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle">Нова заявка</h2>
    <div class="grid2">
      <div class="fld"><label>Ім'я *</label><input id="f-name" /></div>
      <div class="fld"><label>Телефон *</label><input id="f-phone" placeholder="+380…" /></div>
      <div class="fld"><label>Тварина</label><select id="f-pet"><option>Собака</option><option>Кіт</option><option>Інше</option></select></div>
      <div class="fld"><label>Послуга</label><input id="f-service" list="svcList" /><datalist id="svcList">
        <option>Гігієнічний комплекс</option><option>Повний комплекс (зі стрижкою)</option><option>Стрижка</option>
        <option>Вичісування / експрес-линька</option><option>Догляд для котиків</option><option>Міні-готель</option><option>Денний садочок</option>
      </datalist></div>
      <div class="fld" id="f-breed-fld"><label>Порода</label><select id="f-breed"></select><small id="f-breed-note" class="muted" hidden>Для котів порода не вибирається — вкажіть лише вагу.</small></div>
      <div class="fld"><label>Вага</label><select id="f-weight"></select></div>
      <div class="fld"><label>Майстер</label><select id="f-staff"></select></div>
      <div class="fld"><label>Дата візиту</label><input id="f-date" type="date" /></div>
      <div class="fld"><label>Час</label><input id="f-time" type="time" /></div>
      <div class="fld"><label>Сума, ₴</label><input id="f-price" type="number" min="0" step="10" placeholder="напр. 1200" /></div>
      <div class="fld"><label>Джерело</label><select id="f-source"><option value="phone">Телефон</option><option value="instagram">Instagram</option><option value="site">Сайт</option><option value="other">Інше</option></select></div>
      <div class="fld"><label>Статус</label><select id="f-status"><option value="new">Нова</option><option value="confirmed">Підтверджена</option><option value="done">Виконана</option><option value="cancelled">Скасована</option></select></div>
      <div class="fld wide"><label>Коментар</label><textarea id="f-note" rows="2" placeholder="Особливості тварини, побажання…"></textarea></div>
    </div>
    <p class="modal-err" id="modalErr"></p>
    <div class="sheet-act">
      <button class="btn ghost sm" id="cancelBtn" style="border-color:var(--line);color:var(--ink-soft)">Скасувати</button>
      <button class="btn" id="saveBtn">Зберегти</button>
    </div>
  </div>
</div>

<script src="data/config.js"></script>
<script>
(function(){
  "use strict";
  var API="https://gavlove-booking.besenok911.workers.dev", KEY="gavlove_admin_token";
  var CFG=window.GL_CONFIG||{staff:[],dogBreeds:[],services:[]};
  var STAFF=CFG.staff||[];
  var $=function(s){return document.querySelector(s);};
  var token=""; try{token=localStorage.getItem(KEY)||"";}catch(e){}
  var all=[], filter="all", q="", view="dash", editId=null, dateFrom="", dateTo="", calRef=null;

  var STATUS=[{v:"new",label:"Нова"},{v:"confirmed",label:"Підтверджена"},{v:"done",label:"Виконана"},{v:"cancelled",label:"Скасована"}];
  var FILTERS=[{v:"all",label:"Усі"}].concat(STATUS);
  var SRC={site:"Сайт",phone:"Телефон",instagram:"Instagram",manual:"Інше",other:"Інше"};

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function money(n){n=Number(n)||0;return n.toLocaleString("uk-UA")+" ₴";}
  function sum(a){return a.reduce(function(x,y){return x+(Number(y)||0);},0);}
  function fmtDate(iso){if(!iso)return"";var d=new Date(iso);if(isNaN(d))return esc(iso);
    return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});}
  function initials(name){var p=(name||"").trim().split(/\s+/);return ((p[0]||"")[0]||"?").toUpperCase();}
  function localISO(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;}

  async function api(path,opts){opts=opts||{};opts.headers=Object.assign({"Authorization":"Bearer "+token},opts.headers||{});
    var r=await fetch(API+path,opts); if(r.status===401)throw{code:401}; return r.json();}

  // populate staff + breed selects
  (function(){
    $("#f-staff").innerHTML='<option value="">— не призначено —</option>'+STAFF.map(function(s){return '<option>'+esc(s)+'</option>';}).join("");
    $("#f-breed").innerHTML='<option value="">Оберіть породу…</option>'+(CFG.dogBreeds||[]).map(function(b){return '<option>'+esc(b)+'</option>';}).join("");
    $("#f-weight").innerHTML='<option value="">Оберіть вагу…</option>'+(CFG.weightOptions||[]).map(function(w){return '<option>'+esc(w)+'</option>';}).join("");
  })();
  function applyPetModal(){var isCat=$("#f-pet").value==="Кіт";$("#f-breed").hidden=isCat;$("#f-breed").disabled=isCat;$("#f-breed-note").hidden=!isCat;}
  $("#f-pet").addEventListener("change",applyPetModal);

  function showLogin(msg){$("#loginCard").hidden=false;$("#dashView").hidden=true;$("#listView").hidden=true;
    $("#tabs").hidden=true;$("#refreshBtn").hidden=true;$("#logoutBtn").hidden=true;$("#loginErr").textContent=msg||"";}
  function showApp(){$("#loginCard").hidden=true;$("#tabs").hidden=false;$("#refreshBtn").hidden=false;$("#logoutBtn").hidden=false;setView(view);}
  function setView(v){view=v;$("#dashView").hidden=(v!=="dash");$("#listView").hidden=(v!=="list");$("#calView").hidden=(v!=="cal");
    [].forEach.call(document.querySelectorAll(".tabbtn"),function(b){b.classList.toggle("on",b.dataset.view===v);});
    if(v==="dash")renderDash(); else if(v==="cal")renderCal(); else render();}
  [].forEach.call(document.querySelectorAll(".tabbtn"),function(b){b.addEventListener("click",function(){setView(b.dataset.view);});});

  async function tryLogin(t){token=t;
    try{var d=await api("/admin/list");try{localStorage.setItem(KEY,token);}catch(e){}all=d.bookings||[];showApp();renderPills();}
    catch(e){showLogin(e&&e.code===401?"Невірний пароль.":"Помилка з'єднання. Спробуйте ще раз.");}}
  $("#loginBtn").addEventListener("click",function(){tryLogin($("#tokenInput").value.trim());});
  $("#tokenInput").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin(e.target.value.trim());});
  $("#logoutBtn").addEventListener("click",function(){try{localStorage.removeItem(KEY);}catch(e){}token="";$("#tokenInput").value="";showLogin("");});
  async function reload(){try{var d=await api("/admin/list");all=d.bookings||[];renderPills();setView(view);}catch(e){if(e.code===401)showLogin("Сесія завершилась, увійдіть знову.");}}
  $("#refreshBtn").addEventListener("click",reload);

  /* ---------- dashboard ---------- */
  function bars(map,order,labelFn){
    var keys=order||Object.keys(map).sort(function(a,b){return map[b]-map[a];});
    var max=Math.max(1,Math.max.apply(null,keys.map(function(k){return map[k]||0;})));
    return keys.map(function(k){var n=map[k]||0;
      return '<div class="bar-row"><span class="lbl">'+esc(labelFn?labelFn(k):k)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+(n/max*100)+'%"></span></span>'+
        '<span class="num">'+n+'</span></div>';}).join("")||'<p class="nodata">Немає даних</p>';
  }
  function countBy(fn){var m={};all.forEach(function(b){var k=fn(b);if(k==null||k==="")return;m[k]=(m[k]||0)+1;});return m;}
  function within(iso,days){var d=new Date(iso);return !isNaN(d)&&(Date.now()-d.getTime())<=days*86400000;}

  function renderDash(){
    var done=all.filter(function(b){return b.status==="done";});
    var doneRev=sum(done.map(function(b){return b.price;}));
    var planned=sum(all.filter(function(b){return b.status==="new"||b.status==="confirmed";}).map(function(b){return b.price;}));
    var dwp=done.filter(function(b){return Number(b.price)>0;});
    var avg=dwp.length?Math.round(doneRev/dwp.length):0;
    var nw=all.filter(function(b){return (b.status||"new")==="new";}).length;

    // staff aggregation
    var sm={};
    all.forEach(function(b){var s=(b.staff||"").trim()||"Не призначено";
      var m=sm[s]||(sm[s]={orders:0,done:0,rev:0});
      if(b.status!=="cancelled")m.orders++;
      if(b.status==="done"){m.done++;m.rev+=Number(b.price)||0;}});
    var staff=Object.keys(sm).map(function(k){return Object.assign({name:k},sm[k]);})
      .sort(function(a,b){return b.rev-a.rev||b.orders-a.orders;});
    var maxRev=Math.max(1,Math.max.apply(null,staff.map(function(s){return s.rev;})));

    // revenue by service (done)
    var svcRev={};done.forEach(function(b){var k=b.service||"—";svcRev[k]=(svcRev[k]||0)+(Number(b.price)||0);});

    // 14-day requests trend
    var byDay={};for(var i=13;i>=0;i--){var dd=new Date();dd.setHours(0,0,0,0);dd.setDate(dd.getDate()-i);byDay[dd.toISOString().slice(0,10)]=0;}
    all.forEach(function(b){var k=(b.created_at||"").slice(0,10);if(k in byDay)byDay[k]++;});
    var dk=Object.keys(byDay),dmx=Math.max(1,Math.max.apply(null,dk.map(function(k){return byDay[k];})));

    var scol={new:"Нова",confirmed:"Підтверджена",done:"Виконана",cancelled:"Скасована"};

    $("#dashView").innerHTML=
      '<div class="kpis">'+
        '<div class="kpi green"><div class="ic">💰</div><div class="k">Дохід (виконано)</div><div class="v">'+money(doneRev)+'</div><div class="sub">'+dwp.length+' виконаних із сумою</div></div>'+
        '<div class="kpi"><div class="ic">📅</div><div class="k">Заплановано</div><div class="v">'+money(planned)+'</div><div class="sub">нові + підтверджені</div></div>'+
        '<div class="kpi gold"><div class="ic">🧾</div><div class="k">Середній чек</div><div class="v">'+money(avg)+'</div><div class="sub">за виконаними</div></div>'+
        '<div class="kpi rose"><div class="ic">🐾</div><div class="k">Заявки</div><div class="v">'+all.length+'</div><div class="sub">'+nw+' нових</div></div>'+
      '</div>'+
      '<div class="dash-grid">'+
        '<div class="panel"><h3>Майстри <span class="tag">дохід · записи</span></h3>'+
          (staff.length?staff.map(function(s,i){var cls="c"+((i%4)+1);if(s.name==="Не призначено")cls="c0";
            return '<div class="staff-row"><div class="staff-head">'+
              '<span class="avatar '+cls+'">'+esc(initials(s.name))+'</span>'+
              '<div class="staff-meta"><div class="staff-name">'+esc(s.name)+'</div>'+
                '<div class="staff-sub">'+s.orders+' записів · '+s.done+' виконано</div></div>'+
              '<div class="staff-rev">'+money(s.rev)+'</div></div>'+
              '<div class="staff-bar"><i style="width:'+(s.rev/maxRev*100)+'%"></i></div></div>';}).join(""):'<p class="nodata">Немає даних</p>')+
        '</div>'+
        '<div class="panel"><h3>Дохід за послугами <span class="tag">виконано</span></h3>'+
          (Object.keys(svcRev).length?bars(svcRev,null,null):'<p class="nodata">Немає даних</p>')+'</div>'+
      '</div>'+
      '<div class="dash-grid">'+
        '<div class="panel"><h3>Джерела заявок</h3>'+bars(countBy(function(b){return b.source||"site";}),null,function(k){return SRC[k]||k;})+'</div>'+
        '<div class="panel"><h3>За статусом</h3>'+bars(countBy(function(b){return b.status||"new";}),["new","confirmed","done","cancelled"],function(k){return scol[k];})+'</div>'+
      '</div>'+
      '<div class="dash-grid">'+
        '<div class="panel"><h3>Тварини</h3>'+bars(countBy(function(b){return b.pet||"—";}),null,null)+'</div>'+
        '<div class="panel"><h3>Топ послуг <span class="tag">кількість</span></h3>'+bars(countBy(function(b){return b.service||"—";}),null,null)+'</div>'+
      '</div>'+
      '<div class="panel full"><h3>Заявки за 14 днів</h3><div class="days">'+
        dk.map(function(k){var n=byDay[k];var d2=new Date(k);
          return '<div class="day"><span class="dv">'+(n||"")+'</span><span class="db" style="height:'+(n/dmx*100)+'%"></span>'+
            '<span class="dl">'+d2.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"})+'</span></div>';}).join("")+
      '</div></div>';
  }

  /* ---------- calendar ---------- */
  function renderCal(){
    if(!calRef){calRef=new Date();calRef.setDate(1);}
    var y=calRef.getFullYear(), mo=calRef.getMonth();
    var first=new Date(y,mo,1);
    var startDow=(first.getDay()+6)%7;               // Monday-first
    var daysIn=new Date(y,mo+1,0).getDate();
    var todayISO=localISO(new Date());
    var byDate={};
    all.forEach(function(b){ if(b.date){ (byDate[b.date]=byDate[b.date]||[]).push(b); } });
    Object.keys(byDate).forEach(function(k){ byDate[k].sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); }); });
    var cells=[]; for(var i=0;i<startDow;i++)cells.push(null);
    for(var dd=1;dd<=daysIn;dd++)cells.push(new Date(y,mo,dd));
    while(cells.length%7)cells.push(null);
    var monthName=first.toLocaleDateString("uk-UA",{month:"long",year:"numeric"});
    var dows=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
    var html='<div class="cal-head"><div class="cal-title">'+esc(monthName)+'</div>'+
      '<div class="cal-nav"><button class="btn sm" id="calPrev">‹</button>'+
      '<button class="btn sm" id="calToday">Сьогодні</button>'+
      '<button class="btn sm" id="calNext">›</button></div></div>';
    html+='<div class="cal-grid">'+dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
    cells.forEach(function(c){
      if(!c){ html+='<div class="cal-cell out"></div>'; return; }
      var iso=localISO(c), evs=byDate[iso]||[];
      html+='<div class="cal-cell'+(iso===todayISO?' today':'')+'"><div class="cal-daynum">'+c.getDate()+'</div>'+
        evs.slice(0,4).map(function(b){
          return '<div class="cal-ev st-'+(b.status||"new")+'" data-id="'+b.id+'" title="'+esc((b.time||"")+" "+(b.name||"")+" · "+(b.service||"")+(b.staff?" · "+b.staff:""))+'">'+
            esc((b.time?b.time+" ":"")+(b.name||""))+'</div>';
        }).join("")+
        (evs.length>4?'<div class="cal-more">+'+(evs.length-4)+' ще</div>':'')+
      '</div>';
    });
    html+='</div>';
    $("#calView").innerHTML=html;
    $("#calPrev").onclick=function(){calRef.setMonth(calRef.getMonth()-1);renderCal();};
    $("#calNext").onclick=function(){calRef.setMonth(calRef.getMonth()+1);renderCal();};
    $("#calToday").onclick=function(){calRef=new Date();calRef.setDate(1);renderCal();};
    [].forEach.call(document.querySelectorAll("#calView .cal-ev"),function(el){
      el.addEventListener("click",function(){var b=all.filter(function(x){return String(x.id)===el.dataset.id;})[0];if(b)openModal(b);});
    });
  }

  /* ---------- filters + table ---------- */
  function renderPills(){var box=$("#pills");box.innerHTML="";
    FILTERS.forEach(function(f){var n=f.v==="all"?all.length:all.filter(function(b){return (b.status||"new")===f.v;}).length;
      var b=document.createElement("button");b.className="pill"+(filter===f.v?" on":"");
      b.innerHTML=esc(f.label)+'<span class="cnt">'+n+'</span>';
      b.addEventListener("click",function(){filter=f.v;renderPills();render();});box.appendChild(b);});}
  $("#search").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();render();});
  $("#pFrom").addEventListener("change",function(e){dateFrom=e.target.value;render();});
  $("#pTo").addEventListener("change",function(e){dateTo=e.target.value;render();});
  $("#pClear").addEventListener("click",function(){dateFrom="";dateTo="";$("#pFrom").value="";$("#pTo").value="";render();});

  function render(){
    var list=all.filter(function(b){
      if(filter!=="all"&&(b.status||"new")!==filter)return false;
      if(dateFrom&&(!b.date||b.date<dateFrom))return false;
      if(dateTo&&(!b.date||b.date>dateTo))return false;
      if(q){var hay=((b.name||"")+" "+(b.phone||"")+" "+(b.service||"")+" "+(b.breed||"")+" "+(b.staff||"")).toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;});
    $("#meta").textContent="Показано: "+list.length+" із "+all.length;
    var rows=$("#rows");rows.innerHTML="";$("#empty").hidden=list.length>0;
    list.forEach(function(b){var tr=document.createElement("tr");var st=b.status||"new";var sr=b.source||"site";
      var srcClass=({site:"src-site",phone:"src-phone",instagram:"src-instagram"})[sr]||"src-other";
      var visit=b.date?(esc(b.date)+(b.time?(" "+esc(b.time)):"")):'<span class="muted">—</span>';
      var opts=STATUS.map(function(s){return '<option value="'+s.v+'"'+(s.v===st?" selected":"")+'>'+s.label+'</option>';}).join("");
      var noteic=b.note?'<span class="noteic" title="'+esc(b.note)+'">💬</span>':'';
      tr.innerHTML=
        '<td class="client"><div class="nm">'+esc(b.name)+'</div><div class="ph"><a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a></div></td>'+
        '<td>'+esc(b.pet)+(function(){var pd=[b.breed,b.weight].filter(Boolean).join(", ");return pd?'<span class="muted"> · '+esc(pd)+'</span>':'';})()+'</td>'+
        '<td>'+esc(b.service)+(String(b.is_request)==="1"?'<span class="req">заявка</span>':'')+noteic+'</td>'+
        '<td class="when">'+visit+'</td>'+
        '<td>'+(b.staff?esc(b.staff):'<span class="muted">—</span>')+'</td>'+
        '<td class="price">'+(Number(b.price)>0?money(b.price):'<span class="muted">—</span>')+'</td>'+
        '<td><span class="src '+srcClass+'">'+esc(SRC[sr]||sr)+'</span></td>'+
        '<td><select class="status s-'+st+'">'+opts+'</select></td>'+
        '<td><div class="rowact"><button class="btn icon edit" title="Редагувати">✎</button><button class="btn danger sm del" title="Видалити">✕</button></div></td>';
      tr.querySelector("select.status").addEventListener("change",async function(e){var v=e.target.value;
        try{await api("/admin/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.id,status:v})});
          b.status=v;renderPills();render();}catch(err){alert("Не вдалося оновити статус");}});
      tr.querySelector("button.edit").addEventListener("click",function(){openModal(b);});
      tr.querySelector("button.del").addEventListener("click",async function(){if(!confirm("Видалити запис "+(b.name||"")+"?"))return;
        try{await api("/admin/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.id})});
          all=all.filter(function(x){return x.id!==b.id;});renderPills();render();}catch(err){alert("Не вдалося видалити");}});
      rows.appendChild(tr);});
  }

  /* ---------- modal ---------- */
  function openModal(b){editId=b?b.id:null;
    $("#modalTitle").textContent=b?"Редагувати заявку":"Нова заявка";
    $("#f-name").value=b?b.name||"":"";$("#f-phone").value=b?b.phone||"":"";
    $("#f-pet").value=b&&["Собака","Кіт"].indexOf(b.pet)>=0?b.pet:(b?"Інше":"Собака");
    $("#f-service").value=b?b.service||"":"";
    $("#f-breed").value=b?b.breed||"":"";$("#f-weight").value=b?b.weight||"":"";
    $("#f-staff").value=b?b.staff||"":"";
    $("#f-source").value=b?(b.source||"site"):"phone";
    $("#f-date").value=b?b.date||"":"";$("#f-time").value=b?b.time||"":"";
    $("#f-price").value=(b&&b.price!=null)?b.price:"";
    $("#f-status").value=b?(b.status||"new"):"new";$("#f-note").value=b?b.note||"":"";
    applyPetModal();
    $("#modalErr").textContent="";$("#modal").classList.add("open");$("#f-name").focus();}
  function closeModal(){$("#modal").classList.remove("open");}
  $("#newBtn").addEventListener("click",function(){openModal(null);});
  $("#cancelBtn").addEventListener("click",closeModal);
  $("#modal").addEventListener("click",function(e){if(e.target===$("#modal"))closeModal();});
  $("#saveBtn").addEventListener("click",async function(){
    var pv=$("#f-price").value.trim();
    var isCat=$("#f-pet").value==="Кіт";
    var payload={name:$("#f-name").value.trim(),phone:$("#f-phone").value.trim(),pet:$("#f-pet").value,
      service:$("#f-service").value.trim(),breed:isCat?"":$("#f-breed").value,weight:$("#f-weight").value.trim(),
      staff:$("#f-staff").value,source:$("#f-source").value,date:$("#f-date").value,time:$("#f-time").value,
      price:pv===""?"":Number(pv),status:$("#f-status").value,note:$("#f-note").value.trim()};
    if(!payload.name||!payload.phone){$("#modalErr").textContent="Вкажіть ім'я і телефон.";return;}
    try{
      if(editId){payload.id=editId;await api("/admin/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}
      else{await api("/admin/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}
      closeModal();await reload();setView("list");
    }catch(err){$("#modalErr").textContent="Не вдалося зберегти. Спробуйте ще раз.";}
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

  if(token){tryLogin(token);}else{showLogin("");}
})();
</script>
</body>
